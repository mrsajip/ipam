<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPAMS - IP Address Management System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } } } }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col font-sans">

  <!-- AUTH SCREEN -->
  <div id="loginScreen" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-8 shadow-2xl border border-slate-700 space-y-6">
      
      <div class="text-center">
        <div class="inline-flex p-4 rounded-2xl bg-brand-600/10 text-brand-600 dark:text-brand-400 mb-3">
          <i class="fa-solid fa-network-wired text-4xl"></i>
        </div>
        <h2 id="authFormTitle" class="text-2xl font-bold text-slate-900 dark:text-white">IPAMS Login</h2>
        <p id="authFormSubtitle" class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your Email and Password</p>
      </div>

      <div id="authError" class="hidden p-3 rounded-lg bg-rose-50 text-rose-700 text-xs border border-rose-200 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation text-sm flex-shrink-0"></i>
        <span id="authErrorMsg">Invalid credentials</span>
      </div>

      <form id="authForm" onsubmit="handleDirectAuth(event)" class="space-y-4">
        <div id="nameFieldContainer" class="hidden">
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
          <input type="text" id="authName" placeholder="e.g. John Doe" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input type="email" id="authEmail" required placeholder="name@company.com" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <input type="password" id="authPassword" required minlength="4" placeholder="••••••••" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm focus:outline-none" />
        </div>

        <button type="submit" id="authSubmitBtn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md transition text-sm">
          Sign In
        </button>
      </form>

      <div class="text-center text-xs text-slate-500 dark:text-slate-400 pt-2 border-t border-slate-100 dark:border-slate-700">
        <span id="toggleAuthText">Don't have an account?</span>
        <button type="button" onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-brand-600 dark:text-brand-400 font-semibold ml-1 hover:underline">
          Create Account
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer" class="hidden flex-1 flex flex-col">
    <header class="sticky top-0 z-30 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-brand-600 text-white p-2 rounded-lg"><i class="fa-solid fa-network-wired"></i></div>
        <span class="font-bold text-lg text-slate-900 dark:text-white">IPAMS Dashboard</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="userBadge" class="text-xs font-medium text-slate-600 dark:text-slate-300"></span>
        <button onclick="logout()" class="text-xs bg-rose-600 text-white px-3 py-1.5 rounded-lg">Logout</button>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
      <p class="text-sm text-slate-500">Successfully connected & logged in!</p>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOIx8H1h7y2mpEoZubwksubqweVBuAzBI",
      authDomain: "ipams-database.firebaseapp.com",
      projectId: "ipams-database",
      storageBucket: "ipams-database.firebasestorage.app",
      messagingSenderId: "875335708106",
      appId: "1:875335708106:web:15e70aed8875b680593333"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let isSignUpMode = false;

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('authFormTitle').innerText = isSignUpMode ? "Create Account" : "IPAMS Login";
      document.getElementById('authSubmitBtn').innerText = isSignUpMode ? "Sign Up" : "Sign In";
      document.getElementById('toggleAuthText').innerText = isSignUpMode ? "Already have an account?" : "Don't have an account?";
      document.getElementById('toggleAuthBtn').innerText = isSignUpMode ? "Sign In" : "Create Account";
      document.getElementById('nameFieldContainer').classList.toggle('hidden', !isSignUpMode);
    }

    async function handleDirectAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const name = document.getElementById('authName').value.trim();

      const userDocRef = db.collection("users").doc(email.toLowerCase());

      if (isSignUpMode) {
        const doc = await userDocRef.get();
        if (doc.exists) {
          alert("User already exists with this Email!");
          return;
        }
        await userDocRef.set({ email, password, name: name || email.split('@')[0], createdAt: new Date().toISOString() });
        alert("Account Created Successfully! Logging in...");
        showApp(email);
      } else {
        const doc = await userDocRef.get();
        if (!doc.exists || doc.data().password !== password) {
          alert("Invalid Email or Password!");
          return;
        }
        showApp(email);
      }
    }

    function showApp(email) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('userBadge').innerText = email;
    }

    function logout() {
      document.getElementById('appContainer').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }
  </script>
</body>
</html>
